<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokémon – Pikachu</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Pokémon</div>
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </nav>

  <!-- Main -->
  <div class="container">

    <!-- Left -->
    <div class="left">
      <div class="pokeball"></div>

      <p class="gen-label">Pikachu Gen I</p>
      <h1 class="pokemon-name">Pikachu</h1>
      <p class="description">
        Pikachu is an Electric-type Pikachu introduced in Generation I.
        Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
        They are almost completely covered by yellow fur.
      </p>
      <div class="counter">
        <div class="counter-line"></div>
        <span class="counter-text">01 / 08</span>
      </div>
    </div>

    <!-- Right -->
    <div class="right">
      <img
        class="pokemon-img"
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
        alt="Pikachu"
      />
    </div>

  </div>

  <!-- Dots -->
  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</body>
</html>
