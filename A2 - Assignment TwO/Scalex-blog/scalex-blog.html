<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ScaleX – Insights & Blogs</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;900&display=swap" rel="stylesheet"/>
 <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
      <!-- ScaleX logo mark -->
      <svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,20 8,4 14,12 20,4 28,20" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <span>ScaleX</span>
    </div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About Us</a>
      <a href="#">Blogs</a>
      <a href="#">Contact Us</a>
    </div>
    <button class="btn-get-started">Get Started</button>
  </nav>

  <!-- Hero -->
  <div class="hero">
    <h1>Insights &amp; Blogs</h1>
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="filter-btn active">All</button>
    <button class="filter-btn">Tech</button>
    <button class="filter-btn">SaaS</button>
    <button class="filter-btn">Marketing</button>
  </div>

  <!-- Cards -->
  <div class="cards-grid">

    <div class="blog-card">
      <img
        src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=600&q=80"
        alt="SaaS Marketing"
        onerror="this.src='https://placehold.co/600x240/e05b2a/fff?text=Tech'"
      />
      <div class="card-body">
        <span class="card-tag">Tech</span>
        <div class="card-title">The Ultimate Guide To SaaS Marketing</div>
        <div class="card-date">May 23, 2025</div>
      </div>
    </div>

    <div class="blog-card">
      <img
        src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600&q=80"
        alt="SaaS Growth"
        onerror="this.src='https://placehold.co/600x240/e05b2a/fff?text=SaaS'"
      />
      <div class="card-body">
        <span class="card-tag">SaaS</span>
        <div class="card-title">5 Key Trends In SaaS Growth For 2025</div>
        <div class="card-date">May 23, 2025</div>
      </div>
    </div>

    <div class="blog-card">
      <img
        src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=600&q=80"
        alt="Data Driven"
        onerror="this.src='https://placehold.co/600x240/e05b2a/fff?text=Marketing'"
      />
      <div class="card-body">
        <span class="card-tag">Marketing</span>
        <div class="card-title">How Data-Driven Strategies Are Important</div>
        <div class="card-date">May 23, 2025</div>
      </div>
    </div>

  </div>

</body>
</html>
